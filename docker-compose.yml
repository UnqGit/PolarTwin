version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: polar
      POSTGRES_PASSWORD: polar_password
      POSTGRES_DB: polartwin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      - DATABASE_URL=postgresql://polar:polar_password@postgres:5432/polartwin
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  simulator-worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["python", "-m", "twin_sim.worker"]
    environment:
      - DATABASE_URL=postgresql://polar:polar_password@postgres:5432/polartwin
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "3000:80"
    depends_on:
      - api

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
