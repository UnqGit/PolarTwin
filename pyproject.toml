[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polar-twin"
version = "0.1.0"
description = "Schema-driven digital twin simulator"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "httpx>=0.24.1"
]

[project.scripts]
twin-sim = "twin_sim.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.pyright]
include = ["src", "compiler"]

extraPaths = ["."]
