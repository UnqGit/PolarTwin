[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polar-twin"
version = "0.2.0"
description = "PolarTwin — Antarctic research station digital twin simulator"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "httpx>=0.24.1"
]

[project.scripts]
twin-sim = "twin_sim.cli:main"

[tool.pytest.ini_options]
# Include both src (existing) and root (for packages/) in the Python path.
pythonpath = ["src", "."]
testpaths = ["tests", "packages"]

[tool.pyright]
include = ["src", "compiler", "packages"]
extraPaths = ["."]
